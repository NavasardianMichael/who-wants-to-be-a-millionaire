# =============================================================================
# nginx — API host (Express). Install to
# /etc/nginx/sites-available/api.who-wants-to-be-a-millionaire.eapps.site.conf and
# symlink into sites-enabled. Serves api.who-wants-to-be-a-millionaire.eapps.site
# over HTTPS only; paths assume APP_DIR=/home/michael/apps/who-wants-to-be-a-millionaire.
#
# HTTPS only: plain HTTP is neither served nor redirected — the :80 server closes every
# connection (444). certbot's nginx authenticator still renews this name over :80: it adds
# its challenge location to this block for the moment of the check and removes it again.
#
# The API is a separate origin on purpose: the millionaire_session cookie is set by this
# origin (Domain = the web host in production, server/src/lib/cookie-domain.ts),
# CORS_ORIGIN names the web host, and GOOGLE_REDIRECT_URI must point here so the OAuth
# callback can set that cookie.
# =============================================================================

# Flood brake: requests per client IP, before Node or Postgres does any work. The app's own
# per-route limits (server/src/middleware/rateLimit.ts) still decide the fine-grained ones.
# Far above any player, and above a carrier NAT full of them; it only stops floods.
# Page renders reach the API on 127.0.0.1:9006 directly (API_INTERNAL_URL), never through
# here, so a busy site cannot trip it. The zone name is host-wide: unique beside bookie's.
limit_req_zone $binary_remote_addr zone=millionaire_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.who-wants-to-be-a-millionaire.eapps.site;

    location / {
        return 444;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.who-wants-to-be-a-millionaire.eapps.site;

    ssl_certificate     /etc/letsencrypt/live/api.who-wants-to-be-a-millionaire.eapps.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.who-wants-to-be-a-millionaire.eapps.site/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Avatars are posted through multer, capped at 5 MB by the API
    # (server/src/routes/profile.ts). Keep this above that, or nginx rejects with 413
    # before Express can answer in the envelope.
    client_max_body_size 6m;

    # Uploaded avatars live in shared/, outside every release, so they survive deploys.
    # Served from disk here — Express never sees these requests, though it still mounts the
    # same directory at /uploads as a fallback. File names are unique per upload, so the
    # long cache is safe.
    location /uploads/ {
        alias /home/michael/apps/who-wants-to-be-a-millionaire/shared/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        # Bursts of up to 100 pass at once; past that, 429 from @too_many_requests.
        limit_req        zone=millionaire_api burst=100 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_requests;

        proxy_pass http://127.0.0.1:9006;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do NOT clear or rewrite Origin/Referer. requireSameOrigin
        # (server/src/middleware/csrf.ts) rejects any state-changing request whose Origin
        # does not equal CORS_ORIGIN, and in production rejects one that carries neither.

        proxy_connect_timeout 10s;
        # A cold question bucket is generated by Gemini on the request — the model chain
        # with retries can take tens of seconds. Longer than bookie's 60s on purpose.
        proxy_read_timeout    90s;
        proxy_send_timeout    60s;
    }

    # nginx's own 429, shaped like the API's: the `{ value, error }` envelope, and the CORS
    # headers Express would have sent. Without them the browser hides the response and the
    # app reports a network error instead of "too many requests". The API's own 429s pass
    # through untouched (no proxy_intercept_errors), so this answers only the flood brake.
    location @too_many_requests {
        default_type application/json;
        add_header Access-Control-Allow-Origin      "https://who-wants-to-be-a-millionaire.eapps.site" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary                             "Origin" always;
        add_header Retry-After                      "1" always;
        return 429 '{"value":null,"error":{"code":429,"message":"Too many requests"}}';
    }
}
