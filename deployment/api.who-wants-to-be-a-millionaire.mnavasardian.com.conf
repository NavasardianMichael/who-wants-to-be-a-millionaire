# =============================================================================
# nginx — API host (Express). Install to
# /etc/nginx/sites-available/api.who-wants-to-be-a-millionaire.mnavasardian.com.conf and
# symlink into sites-enabled. Serves api.who-wants-to-be-a-millionaire.mnavasardian.com
# over HTTPS only; paths assume APP_DIR=/home/michael/apps/millionaire.
#
# No :80 server on purpose. HTTP to this Host falls through to nginx's default_server —
# it is not an API on-ramp. Certbot HTTP-01 for this name therefore needs another vhost
# on :80 (or a DNS challenge).
#
# The API is a separate origin on purpose: the millionaire_session cookie is set by this
# origin (Domain = the web host in production, server/src/lib/cookie-domain.ts),
# CORS_ORIGIN names the web host, and GOOGLE_REDIRECT_URI must point here so the OAuth
# callback can set that cookie.
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.who-wants-to-be-a-millionaire.mnavasardian.com;

    ssl_certificate     /etc/letsencrypt/live/api.who-wants-to-be-a-millionaire.mnavasardian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.who-wants-to-be-a-millionaire.mnavasardian.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Avatars are posted through multer, capped at 5 MB by the API
    # (server/src/routes/profile.ts). Keep this above that, or nginx rejects with 413
    # before Express can answer in the envelope.
    client_max_body_size 6m;

    # Uploaded avatars live in shared/, outside every release, so they survive deploys.
    # Served from disk here — Express never sees these requests, though it still mounts the
    # same directory at /uploads as a fallback. File names are unique per upload, so the
    # long cache is safe.
    location /uploads/ {
        alias /home/michael/apps/millionaire/shared/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:9006;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do NOT clear or rewrite Origin/Referer. requireSameOrigin
        # (server/src/middleware/csrf.ts) rejects any state-changing request whose Origin
        # does not equal CORS_ORIGIN, and in production rejects one that carries neither.

        proxy_connect_timeout 10s;
        # A cold question bucket is generated by Gemini on the request — the model chain
        # with retries can take tens of seconds. Longer than bookie's 60s on purpose.
        proxy_read_timeout    90s;
        proxy_send_timeout    60s;
    }
}
